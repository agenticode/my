<svg xmlns="http://www.w3.org/2000/svg" class="fig" role="img" aria-label="CPU1_D1 S/N 2AEB41: errors per day and events, 2026-07-31 to 2026-11-12" viewBox="0 0 736 277" width="736" height="277"><title>CPU1_D1 S/N 2AEB41: errors per day and events, 2026-07-31 to 2026-11-12</title><style>
/* The style of the figures. A figure written on its own carries this
   sheet and nothing else of the report. */
/* Colours. One hue for corrected errors, darker where there are more;
   red for uncorrected errors and for "replace now". A grade is always
   told by a mark as well as by its colour. */
:root {
  color-scheme: light;
  --page: #f1f0ec;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --ink3: #6a6964;
  --line: #e1e0d9;
  --axis: #c3c2b7;
  --wash: #f4f3ef;
  --link: #1c5cab;
  --series: #2a78d6;
  --dim: #dcdbd3;
  --h0: #efeeea;
  --h1: #86b6ef;
  --h2: #3987e5;
  --h3: #1c5cab;
  --h4: #0d366b;
  --ok: #dfe6dc;
  --observe: #2a78d6;
  --consider: #eda100;
  --replace: #d03b3b;
  --hold: #e87ba4;
  --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

/* Grades: a colour and a mark. */
.g-ok { --f: var(--ok); --gi: var(--ink2); }
.g-observe { --f: var(--observe); --gi: #fff; }
.g-consider { --f: var(--consider); --gi: #0b0b0b; }
.g-replace { --f: var(--replace); --gi: #fff; }
.g-hold { --f: var(--hold); --gi: #0b0b0b; }
.cell { fill: var(--f); }
.g-empty .cell { fill: none; stroke: var(--axis); stroke-width: 1; }
.g-unknown .cell { fill: none; stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3 2; }
.gl { fill: none; stroke: var(--gi); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.gl .dot { fill: var(--gi); stroke: none; }
/* Figures. */
.fig text { font-family: var(--sans); font-size: 10.5px; fill: var(--ink3); }
.fig .rowlabel { font-size: 12px; font-weight: 600; fill: var(--ink); }
.fig .celllabel, .fig .rowaddr, .fig .axis, .fig .tick, .fig .serieslabel, .fig .seglabel { font-family: var(--mono); }
.fig .rowaddr { fill: var(--ink2); }
.fig .celllabel { font-size: 9.5px; }
.fig .serieslabel { font-size: 11px; fill: var(--ink); }
.fig .tick, .fig .peak { font-variant-numeric: tabular-nums; }
.ax { fill: none; stroke: var(--axis); stroke-width: 1; }
.grid, .lane { fill: none; stroke: var(--line); stroke-width: 1; }
.guide { fill: none; stroke: var(--axis); stroke-width: 1; }
a.slot:hover .cell, a.slot:focus .cell { stroke: var(--ink); stroke-width: 1.5; }
.slot .pointer { fill: var(--ink); }
svg a { cursor: pointer; }
svg a:focus { outline: none; }

/* Topology bars. */
.seg rect { fill: var(--series); }
.seg.dim rect { fill: var(--dim); }
.fig .seglabel, .fig .segshare { font-size: 11px; fill: #fff; }
.fig .seg.dim text { fill: var(--ink2); }

/* Address map. */
.ht0 { fill: var(--h0); }
.ht1 { fill: var(--h1); }
.ht2 { fill: var(--h2); }
.ht3 { fill: var(--h3); }
.ht4 { fill: var(--h4); }
.ue { fill: var(--replace); }
.uex { fill: none; stroke: #fff; stroke-width: 1.4; stroke-linecap: round; }
a.pt:hover rect, a.pt:focus rect, a.pt:hover circle, a.pt:focus circle { stroke: var(--ink); stroke-width: 1.4; }
.gapdots { fill: none; stroke: var(--ink3); stroke-width: 1.8; stroke-linecap: round; }
.fig .gapnote { fill: var(--ink3); }
.fig .note { fill: var(--ink); }
.notearrow { fill: none; stroke: var(--ink2); stroke-width: 1.2; stroke-linecap: round; }
.caret { fill: var(--ink2); }

/* Boots: a letter or a number in every cell; the colour repeats it. */
.bt-none rect { fill: var(--h0); }
.bt-ce1 rect { fill: var(--h1); }
.bt-ce2 rect { fill: var(--h2); }
.bt-ce3 rect { fill: var(--h3); }
.bt-ue rect, .bt-stop rect { fill: var(--replace); }
.bt-stop rect { stroke: var(--ink); stroke-width: 1.2; }
.bt-unknown rect { fill: none; stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 2 2; }
.bt-absent rect { fill: none; stroke: var(--axis); stroke-width: 1; }
.fig .bt-ce2 text, .fig .bt-ce3 text, .fig .bt-ue text, .fig .bt-stop text { fill: #fff; font-weight: 600; }
.fig .stopmark { fill: var(--replace); font-weight: 700; }
.multi { fill: none; stroke: var(--ink); stroke-width: 1.4; }

/* Timeline. */
.bars rect { fill: var(--series); }
.mk { stroke: var(--surface); stroke-width: 2; paint-order: stroke; }
.mk-act { fill: var(--series); }
.mk-ctx { fill: var(--ink2); }
.mk-ue { fill: var(--replace); }
.fig .lanelabel { fill: var(--ink2); }

/* Sparkline of the ranking. */
svg.spark { vertical-align: -3px; margin-right: 8px; }
.cite { margin-left: 0; color: var(--ink3); }
.spark .bar { fill: var(--series); }
.spark .zero { fill: var(--axis); }

/* Observation grades. */
.oa { fill: var(--h3); }
.ob { fill: var(--h2); }
.oc { fill: var(--h1); }

/* A figure on its own: a background, a heading, a legend and notes that
   the report gives in the text around the figure. */
.bg { fill: var(--surface); }
.fig .figtitle { font-size: 13px; font-weight: 600; fill: var(--ink); }
.fig .figlegend { font-size: 11px; fill: var(--ink2); }
.fig .fignote { font-size: 11px; fill: var(--ink2); }
