name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: test
        run: make test
      - name: test with the race detector
        run: make test-race

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build linux/amd64, linux/arm64, darwin/arm64
        run: make cross
      - name: linux binaries are statically linked
        run: |
          for f in dist/my-linux-amd64 dist/my-linux-arm64; do
            file "$f"
            file "$f" | grep -q 'statically linked'
          done
      - name: run the native binary
        run: ./dist/my-linux-amd64 version
      - name: scan this machine as a normal user
        run: .github/scripts/live-scan.sh ./dist/my-linux-amd64
      - name: scan this machine as root
        run: sudo .github/scripts/live-scan.sh ./dist/my-linux-amd64
      - name: run the exporter on this machine as a normal user
        run: .github/scripts/live-serve.sh ./dist/my-linux-amd64
      - name: run the exporter on this machine as root
        run: sudo .github/scripts/live-serve.sh ./dist/my-linux-amd64

  release-archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: two builds give the same archives
        run: make dist-check VERSION=v0.0.0-ci
      - name: build the archives and try them
        run: .github/scripts/check-dist.sh v0.0.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: my-v0.0.0-ci
          path: |
            dist/my_v0.0.0-ci_*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
