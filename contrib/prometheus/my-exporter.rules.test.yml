# Tests of my-exporter.rules.yml: promtool test rules my-exporter.rules.test.yml
rule_files:
  - my-exporter.rules.yml

evaluation_interval: 1m

tests:
  - name: findings that are not renewed become stale
    interval: 1m
    input_series:
      # Scans every five minutes for an hour, then none: the time of the
      # last scan stays at 3600.
      - series: 'my_exporter_last_scan_timestamp_seconds{instance="r12-n034:10163", job="memory"}'
        values: '0+0x4 300+0x4 600+0x4 900+0x4 1200+0x4 1500+0x4 1800+0x4 2100+0x4 2400+0x4 2700+0x4 3000+0x4 3300+0x4 3600+0x120'
      # An exporter that keeps scanning.
      - series: 'my_exporter_last_scan_timestamp_seconds{instance="r12-n035:10163", job="memory"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 60m
        alertname: MemoryFindingsStale
        exp_alerts: []
      # Thirty minutes without a scan, and ten more before the alert fires.
      - eval_time: 99m
        alertname: MemoryFindingsStale
        exp_alerts: []
      - eval_time: 102m
        alertname: MemoryFindingsStale
        exp_alerts:
          - exp_labels:
              instance: r12-n034:10163
              job: memory
              severity: warning
            exp_annotations:
              summary: 'The memory findings from r12-n034:10163 are 42m 0s old'
              description: 'The exporter at r12-n034:10163 has not finished a scan for 42m 0s. It still serves the findings of its last scan. Its log says why the scans fail.'
