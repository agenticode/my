# Alert rule for the findings of MemorY (my serve --metrics).
#
# One alert, and it fires on one thing: the finding for a DIMM got worse.
# It does not fire on error counts. A DIMM with corrected errors and a
# steady finding is what the dashboard is for.
#
# my_dimm_verdict is 0 ok, 1 observe, 2 consider replacement, 3 replace now,
# 4 hold replacement. The rule compares the value now with the highest value
# of the hour that ended ten minutes ago. A DIMM that has no value in that
# hour counts as 0 there, so a DIMM that shows up with a finding alerts too:
# on a new host, after a replacement, and when the exporter is first set up.
#
# The alert fires for ten minutes and then ends on its own, because by then
# the hour it looks back on holds the new value. The finding itself stays:
# route the alert without "resolved" messages (see ../alertmanager).
groups:
  - name: my-findings
    rules:
      - alert: MemoryFindingWorse
        expr: |
          my_dimm_verdict
            >
          (
              max_over_time(my_dimm_verdict[1h] offset 10m)
            or
              my_dimm_verdict * 0
          )
        labels:
          finding: >-
            {{ if eq $value 1.0 }}observe{{ else if eq $value 2.0 }}consider-replacement{{ else if eq $value 3.0 }}replace-now{{ else }}hold-replacement{{ end }}
          severity: >-
            {{ if eq $value 1.0 }}info{{ else if eq $value 3.0 }}critical{{ else }}warning{{ end }}
        annotations:
          summary: >-
            {{ $labels.host }} {{ $labels.slot }}: the finding is now
            {{ if eq $value 1.0 }}observe{{ else if eq $value 2.0 }}consider replacement{{ else if eq $value 3.0 }}replace now{{ else }}hold replacement{{ end }}
          description: >-
            DIMM in slot {{ $labels.slot }} of host {{ $labels.host }}{{ if $labels.serial }}, serial number {{ $labels.serial }}{{ end }}.
            {{ if eq $value 4.0 }}A cause outside the DIMM is suspected: check the channel, the slot and the contact before the DIMM is pulled.
            {{ else if eq $value 3.0 }}An uncorrected error, a DIMM that firmware marks as failed, or repair resources that are used up.
            {{ else if eq $value 2.0 }}A fault is rising or spreading, pages keep being taken offline, the scrubber found an uncorrected error, or errors came back after a repair.
            {{ else }}Corrected errors without a growing fault.
            {{ end }}"my why {{ $labels.slot }}" on the host, or /api/dimm/{{ $labels.slot }} of the exporter, shows what the finding rests on.
