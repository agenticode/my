# Alert rule about the exporter itself (my serve --metrics), next to the
# rule about the findings in my-findings.rules.yml.
#
# A scan that fails leaves the metrics of the scan before in place, so the
# findings on a dashboard can be older than they look. This rule says when
# they are. A finding that does not get worse raises no alert; this is what
# tells that silence from a host apart from an exporter that stopped
# reading.
groups:
  - name: my-exporter
    rules:
      - alert: MemoryFindingsStale
        # Thirty minutes: six scans at the default pause of five minutes.
        expr: time() - my_exporter_last_scan_timestamp_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'The memory findings from {{ $labels.instance }} are {{ $value | humanizeDuration }} old'
          description: >-
            The exporter at {{ $labels.instance }} has not finished a scan for {{ $value | humanizeDuration }}.
            It still serves the findings of its last scan. Its log says why the scans fail.
