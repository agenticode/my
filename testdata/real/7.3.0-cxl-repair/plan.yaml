# Injection plan: what was put into the host, where and how many times.
format: 1
scenario: cxl-repair
summary: "errors in one row of two emulated CXL memory devices, a soft post package repair of that row on each, then errors again in the repaired row of one device"
method: "QMP of QEMU: cxl-inject-dram-event with maintenance needed; the repair through /sys/bus/edac/devices/cxl_memN/mem_repairX in the guest"
kernel: 7.3.0-ras
rasdaemon: 1.0.0
qemu: 11.1.3
device: "two QEMU CXL type 3 memory devices, 256 MB volatile each, behind one emulated CXL host bridge with two root ports"
injections:
  - id: quiet-before-1
    time: 2026-11-16T23:33:57.974Z
    inject: error
    severity: CE
    count: 1
    dpa: 0x1002000
    device_name: mem1
    channel: 0
    rank: 0
    bank_group: 1
    bank: 2
    row: 0x1f40
    column: 0x80
    note: "CXL DRAM event record, media ECC error, maintenance needed: soft PPR"
